# cspell:ignore pathofbuildingcommunity pathofbuilding modcache
name: Run Tests
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:
jobs:
  test_loot_filter_sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lupa==2.8
      - name: Verify authorized stash capture collector with fixture transport
        run: python -m unittest discover -s tools -p test_collect_public_stash_capture.py
      - name: Verify native file sync and rollback
        shell: pwsh
        run: |
          python tools/run_headless_lupa.py tools/test_protected_drop_metadata.lua
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "pob-loot-sync")
          python tools/run_headless_lupa.py --filesystem tools/test_loot_filter_daily_sync.lua $fixture.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_headless_lupa.py --filesystem tools/test_loot_filter_daily_sync_ui.lua
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_headless_lupa.py tools/test_loot_trade_overlay.lua
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -File tools/test_loot_filter_background_notifications.ps1
  test_crafting_imports:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated plain item imports
        run: cd src && LUA_PATH='../runtime/lua/?.lua;../runtime/lua/?/init.lua;;' luajit ../tools/check_crafting_imports.lua
      - name: Check catalyst-scaled item imports
        run: cd src && LUA_PATH='../runtime/lua/?.lua;../runtime/lua/?/init.lua;;' luajit ../tools/check_catalyst_imports.lua
  test_planning_workflow:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      - name: Install MCP client runtime
        run: apk add nodejs
      - uses: actions/checkout@v4
      - name: Exercise MCP planning through native review and save
        run: node tools/test_planning_workflow.cjs
  test_cost_probes:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      - uses: actions/checkout@v4
      - name: Check comparison baseline and Timeless jewel tooltip
        run: cd src && LUA_PATH='../runtime/lua/?.lua;../runtime/lua/?/init.lua;;' luajit ../tools/check_comparison_contract.lua
      - name: Compare full and partial skill costs
        run: |
          cd src
          for fixture in ../spec/TestBuilds/3.13/*.xml; do
            LUA_PATH='../runtime/lua/?.lua;../runtime/lua/?/init.lua;;' luajit ../tools/check_cost_warning_probes.lua "$fixture"
          done
  test_ai_bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test desktop MCP bridge
        run: node --test spec/AI/*.test.cjs
      - name: Build and exercise the market relay deployment
        run: node tools/test_loot_market_relay_compose.cjs
  test_headless_ui:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      # cspell:ignore py3
      - name: Install headless test dependencies
        run: apk add git python3 py3-pillow
      - uses: actions/checkout@v4
      - name: Exercise controls and audit frames
        run: |
          (cd src && LUA_PATH='../runtime/lua/?.lua;../runtime/lua/?/init.lua;;' luajit ../tools/benchmark_atlas_report.lua)
          (cd src && LUA_PATH='../runtime/lua/?.lua;../runtime/lua/?/init.lua;;' luajit ../tools/test_spectre_library_ui.lua)
          (cd src && LUA_PATH='../runtime/lua/?.lua;../runtime/lua/?/init.lua;;' luajit ../tools/test_planning_id_collision.lua)
          (cd src && LUA_PATH='../runtime/lua/?.lua;../runtime/lua/?/init.lua;;' luajit ../tools/test_atlas_save_collision.lua)
          python3 tools/test_crafting_data_status.py
          python3 tools/test_crafting_export_refresh.py
          python3 tools/test_compare_crafting_export.py
          python3 tools/test_update_map_crafting_data.py
          python3 tools/test_update_flask_enchant_data.py
          python3 tools/test_delirium_orbs.py
          python3 tools/check_map_crafting_art.py
          python3 tools/test_update_map_item_art.py
          python3 tools/test_update_map_variant_art.py
          python3 tools/test_modifier_overlay_330.py
          python3 tools/test_bench_330.py
          python3 tools/test_update_loot_filter_data.py
          python3 tools/test_compare_filter_base_export.py
          python3 tools/test_update_atlas_filter_supplies.py
          python3 tools/test_check_atlas_release.py
          python3 tools/test_update_genesis_data.py
          python3 tools/test_update_passive_preview.py
          python3 tools/test_update_gem_soul_cores.py
          python3 tools/check_genesis_art.py
          python3 tools/check_loot_filter_data.py
          python3 tools/test_check_update_manifest.py
          python3 tools/test_build_portable_package.py
          python3 tools/test_update_manifest.py
          python3 tools/check_update_manifest.py
          python3 tools/test_render_headless_ui.py
          python3 tools/test_headless_font_paths.py
          python3 tools/check_headless_ui.py
      - name: Upload headless UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-ui
          path: artifacts/headless-ui
          if-no-files-found: error
  run_tests:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        run: busted --lua=luajit
  check_modcache:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      - name: Install git dependency
        run: apk add git
      - name: Checkout
        uses: actions/checkout@v4
      - name: Regenerate ModCache
        env:
          LUA_PATH: ../runtime/lua/?.lua;../runtime/lua/?/init.lua;;
          REGENERATE_MOD_CACHE: 1
        run: cd src; luajit HeadlessWrapper.lua
      - run: git config --global --add safe.directory $(pwd)
      - name: Check if the generated ModCache is different
        run: git diff --exit-code src/Data/ModCache.lua
